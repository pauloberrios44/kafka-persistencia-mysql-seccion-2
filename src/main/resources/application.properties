spring.application.name=ventas

# Conexion al MySQL local de Laragon
spring.datasource.url=jdbc:mysql://localhost:3306/ventas_pcfactory
spring.datasource.username=root
spring.datasource.password=

# Persistencia con JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mostrar las consultas SQL durante el aprendizaje
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONEXION A APACHE KAFKA
# ============================================

# Usar IP o DNS EC2 si Kafka esta en otro servidor
spring.kafka.bootstrap-servers=52.70.209.16:9092

# ============================================
# PRODUCTOR KAFKA
# ============================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Confirmacion de escritura del broker
spring.kafka.producer.acks=all

# ============================================
# CONSUMIDOR KAFKA
# ============================================

spring.kafka.consumer.group-id=mi-grupo-educativo
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Spring Round Robin: Ejecucion circular entre particiones del topico
#spring.kafka.producer.properties.partitioner.class=org.apache.kafka.clients.producer.RoundRobinPartitioner


# Gestion automatica de offsets por Spring Kafka
spring.kafka.consumer.enable-auto-commit=false

# ============================================
# LOGS
# ============================================

logging.level.root=INFO
logging.level.org.springframework.kafka=INFO


app.kafka.topic.ventas=ventas